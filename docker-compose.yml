services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rfid_backend
      POSTGRES_USER: rfid
      POSTGRES_PASSWORD: rfid-dev-password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfid -d rfid_backend"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - rfid-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  rfid-postgres-data:
